name: GitHub Actions

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 20
          - 22
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # = npm run build, sans indexation de la recherche TinaCloud en CI
      - run: npm run prebuild && npx tinacms build --skip-search-index && npx astro build
        env:
          NOCODB_API_TOKEN: ${{ secrets.NOCODB_API_TOKEN }}
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
      - name: E2E Playwright (chromium)
        if: matrix.node-version == 22
        run: npx playwright install --with-deps chromium && npx playwright test --project=chromium
      - name: Rapport Playwright
        if: failure() && matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 7

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:utils
      - run: npm run test:media
      - run: node netlify/functions/__tests__/all-functions.test.js
